<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Kernwacht – Sci-Fi Tower Defense</title>
<meta name="description" content="Verteidige die Forschungsstation Aurelis gegen Alien-Schwärme und Maschinenwesen. Ein Tower-Defense-Spiel direkt im Browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%2305060d' stroke='%2336f1ff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%2336f1ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="topbar">
    <button id="btnMenu" class="ib" title="Menü (Esc)" aria-label="Menü"></button>
    <div class="res credits" title="Credits – für Türme und Ausbau"><i class="ico cred"></i><b id="hCredits">0</b></div>
    <div class="res energy" title="Energie – für Spezialfähigkeiten"><i class="ico en"></i><b id="hEnergy">0</b></div>
    <div class="res hp" title="Lebenspunkte des Reaktorkerns"><i class="ico hp"></i><div class="bar"><div id="hHpBar"></div><div id="hShBar"></div></div><b id="hHp">100</b></div>
    <div class="wave"><span id="hWave">Welle 0</span><small id="hCountdown"></small></div>
    <div id="preview" class="preview" title="Nächste Welle"></div>
    <button id="btnNext" class="next" title="Nächste Welle starten (N)"><span id="nextLabel">Welle starten</span></button>
    <button id="btnSpeed" class="ib speed" title="Spielgeschwindigkeit (F)">1x</button>
    <button id="btnPause" class="ib" title="Pause (Leertaste)" aria-label="Pause"></button>
    <button id="btnMute" class="ib" title="Ton an/aus (M)" aria-label="Ton"></button>
  </div>
  <div id="leftbar"></div>
  <div id="buildbar"></div>
  <div id="buildinfo" class="hidden"></div>
  <div id="panel" class="hidden"></div>
  <div id="bossbar" class="hidden"><span id="bossName">Schwarmträger</span><div class="bar"><div id="bossHp"></div><div id="bossSh"></div></div></div>
  <div id="eventbadge" class="hidden"></div>
  <div id="pausedLabel" class="hidden">PAUSE</div>
  <div id="fps" class="hidden"></div>
</div>

<div id="toasts"></div>
<div id="announce"></div>
<div id="tip" class="hidden"></div>

<section id="scrMenu" class="screen"></section>
<section id="scrMaps" class="screen"></section>
<section id="scrResearch" class="screen"></section>
<section id="scrAch" class="screen"></section>
<section id="scrSettings" class="screen"></section>
<section id="scrDaily" class="screen"></section>
<section id="scrPause" class="screen dim"></section>
<section id="scrEnd" class="screen dim"></section>
<section id="scrConfirm" class="screen dim"></section>
<section id="scrEditor" class="screen editor"></section>

<div id="rotate"><div><div class="rot-ico"></div><p>Bitte drehe dein Gerät ins Querformat.</p></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
